<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bắn chim</title>

<style>
:root{
  --sky1:#7fcdf2;--sky2:#fde6c4;--cloud:rgba(255,255,255,.85);--sun:#ffd166;
  --h1:#86c97f;--h2:#4fa66a;--ink:#16324f;--panel:rgba(255,255,255,.9);--accent:#d43a22;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky1:#1c1b4d;--sky2:#e38b6d;--cloud:rgba(255,205,190,.22);--sun:#fff3d6;
    --h1:#2d3a66;--h2:#1b2547;--ink:#f4eefc;--panel:rgba(24,24,58,.9);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --sky1:#1c1b4d;--sky2:#e38b6d;--cloud:rgba(255,205,190,.22);--sun:#fff3d6;
  --h1:#2d3a66;--h2:#1b2547;--ink:#f4eefc;--panel:rgba(24,24,58,.9);color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sky1);font-family:"Trebuchet MS","Segoe UI",system-ui,-apple-system,sans-serif;color:var(--ink)}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
body.play canvas{cursor:none}
#hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 0;pointer-events:none}
.stat{background:var(--panel);border-radius:14px;padding:6px 16px;line-height:1.05;min-width:76px}
.stat span{display:block;font-size:13px;font-weight:500;opacity:.8}
.stat b{display:block;font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
#panel{position:fixed;inset:0;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.12)}
#panel[hidden]{display:none}
.card{background:var(--panel);border-radius:22px;padding:26px 28px;max-width:420px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.card h1{margin:0 0 6px;font-size:40px;line-height:1.05;font-weight:800}
.card p{margin:0 0 14px;font-size:18px;line-height:1.4;font-weight:500}
.legend{list-style:none;margin:0 0 20px;padding:0;display:grid;gap:6px;font-size:17px;font-weight:500}
.legend li{display:flex;align-items:center;gap:10px}
.legend i{width:20px;height:20px;border-radius:50%;border:2px solid rgba(0,0,0,.35);flex:none}
button{font:inherit;font-size:22px;font-weight:800;background:var(--accent);color:#fff;border:0;border-radius:14px;padding:10px 26px;cursor:pointer}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="stat"><span>Điểm</span><b id="score">0</b></div>
  <div class="stat"><span>Thời gian</span><b id="time">60</b></div>
  <div class="stat"><span>Kỷ lục</span><b id="best">0</b></div>
</div>
<div id="panel">
  <div class="card">
    <h1 id="title">Bắn chim</h1>
    <p id="msg">Rê chuột để ngắm, nhấp chuột để bắn. Bạn có 60 giây. Chim càng nhỏ và nhanh thì điểm càng cao.</p>
    <ul class="legend" id="legend">
      <li><i style="background:#ff5d5d"></i>Chim nhỏ, nhanh: 30 điểm</li>
      <li><i style="background:#ffc233"></i>Chim vừa: 20 điểm</li>
      <li><i style="background:#5b8def"></i>Chim to, chậm: 10 điểm</li>
    </ul>
    <button id="go">Bắt đầu</button>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
const T=[{r:15,pts:30,min:300,max:420,c:'#ff5d5d'},{r:22,pts:20,min:200,max:300,c:'#ffc233'},{r:32,pts:10,min:120,max:200,c:'#5b8def'}];
const DUR=60;
let W,H,K=1,C={},birds=[],parts=[],pops=[],clouds=[];
let state='menu',score=0,left=DUR,best=0,mx=-99,my=-99,kick=0,last=0,spawnT=0.3;
try{best=+localStorage.getItem('bird-best')||0}catch(e){}
$('best').textContent=best;

function theme(){const s=getComputedStyle(document.documentElement);['sky1','sky2','cloud','sun','h1','h2','ink'].forEach(k=>C[k]=s.getPropertyValue('--'+k).trim())}
function resize(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);K=Math.max(.7,Math.min(1.25,W/1000))}
theme();resize();
addEventListener('resize',resize);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',theme);
new MutationObserver(theme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
clouds=[...Array(5)].map(()=>({x:Math.random()*W,y:H*(.06+Math.random()*.4),s:.6+Math.random()*.8,v:8+Math.random()*14}));

let ac;
function snd(hitOk){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type=hitOk?'triangle':'square';o.frequency.setValueAtTime(hitOk?520:140,t);o.frequency.exponentialRampToValueAtTime(hitOk?900:60,t+.12);g.gain.setValueAtTime(.1,t);g.gain.exponentialRampToValueAtTime(.001,t+.15);o.connect(g);g.connect(ac.destination);o.start();o.stop(t+.16)}catch(e){}}

function spawn(){
  const w=Math.random(),t=w<.25?T[0]:w<.6?T[1]:T[2],dir=Math.random()<.5?1:-1,y=H*.1+Math.random()*H*.5;
  birds.push({t,dir,r:t.r*K,x:dir>0?-70:W+70,y,base:y,vx:dir*(t.min+Math.random()*(t.max-t.min))*K,ph:Math.random()*6,wob:15+Math.random()*30,fl:Math.random()*6,dead:false,vy:0,rot:0});
}
const hit=(b,x,y)=>Math.hypot(b.x-x,b.y-y)<b.r*1.3;

function kill(b){
  b.dead=true;b.vy=-120;
  score+=b.t.pts;$('score').textContent=score;
  pops.push({x:b.x,y:b.y-b.r,t:0,txt:'+'+b.t.pts});
  for(let i=0;i<12;i++)parts.push({x:b.x,y:b.y,vx:(Math.random()-.5)*340,vy:-Math.random()*220,rot:Math.random()*6,vr:(Math.random()-.5)*12,life:.9,c:i%3?b.t.c:'#fff'});
}

function start(){
  state='play';score=0;left=DUR;birds=[];parts=[];pops=[];spawnT=.2;
  $('score').textContent=0;$('time').textContent=DUR;
  $('panel').hidden=true;document.body.classList.add('play');
}
function end(){
  state='over';document.body.classList.remove('play');
  const rec=score>best;
  if(rec){best=score;$('best').textContent=best;try{localStorage.setItem('bird-best',best)}catch(e){}}
  $('title').textContent='Hết giờ';
  $('msg').textContent='Bạn ghi được '+score+' điểm. '+(rec?'Đây là kỷ lục mới!':'Kỷ lục hiện tại: '+best+' điểm.');
  $('legend').hidden=true;$('go').textContent='Chơi lại';$('panel').hidden=false;$('go').focus();
}
$('go').addEventListener('click',start);

addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY});
cv.addEventListener('pointerdown',e=>{
  mx=e.clientX;my=e.clientY;
  if(state!=='play')return;
  kick=1;let h=null;
  for(let i=birds.length-1;i>=0;i--){const b=birds[i];if(!b.dead&&hit(b,mx,my)){h=b;break}}
  if(h)kill(h);
  snd(!!h);
});

function update(dt){
  clouds.forEach(c=>{c.x+=c.v*dt;if(c.x>W+160)c.x=-200});
  spawnT-=dt;
  if(spawnT<=0&&birds.length<12){spawn();spawnT=state==='play'?Math.max(.4,1-(DUR-left)*.01)*(.6+Math.random()*.8):1+Math.random()}
  birds.forEach(b=>{
    if(b.dead){b.vy+=900*dt;b.y+=b.vy*dt;b.x+=b.vx*.25*dt;b.rot+=b.dir*5*dt}
    else{b.x+=b.vx*dt;b.y=b.base+Math.sin(b.x*.012+b.ph)*b.wob;b.fl+=dt*(10+Math.abs(b.vx)/40)}
  });
  birds=birds.filter(b=>b.y<H+90&&b.x>-150&&b.x<W+150);
  parts.forEach(p=>{p.vy+=300*dt;p.vx*=.98;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;p.life-=dt});
  parts=parts.filter(p=>p.life>0);
  pops.forEach(p=>{p.y-=55*dt;p.t+=dt});
  pops=pops.filter(p=>p.t<.9);
  kick=Math.max(0,kick-dt*5);
  if(state==='play'){left-=dt;if(left<=0){left=0;end()}$('time').textContent=Math.ceil(left)}
}

function circ(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()}
function hills(col,base,amp,fr,off){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W+20;x+=20)ctx.lineTo(x,H-base-Math.sin(x*fr+off)*amp);ctx.lineTo(W,H);ctx.fill()}

function drawBird(b){
  const r=b.r;
  ctx.save();ctx.translate(b.x,b.y);if(b.dead)ctx.rotate(b.rot);ctx.scale(b.dir,1);
  ctx.lineWidth=2;ctx.strokeStyle='rgba(0,0,0,.35)';ctx.fillStyle=b.t.c;
  ctx.beginPath();ctx.moveTo(-r*.8,0);ctx.lineTo(-r*1.5,-r*.5);ctx.lineTo(-r*1.4,r*.25);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.ellipse(0,0,r,r*.65,0,0,7);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.arc(r*.8,-r*.3,r*.45,0,7);ctx.fill();ctx.stroke();
  ctx.fillStyle='#ff9f1c';ctx.beginPath();ctx.moveTo(r*1.18,-r*.45);ctx.lineTo(r*1.7,-r*.25);ctx.lineTo(r*1.18,-r*.1);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle='#fff';circ(r*.92,-r*.38,r*.15);ctx.fillStyle='#111';circ(r*.96,-r*.38,r*.07);
  const f=b.dead?.9:Math.sin(b.fl);
  ctx.translate(-r*.1,-r*.05);ctx.rotate(f*.75);
  ctx.fillStyle='rgba(255,255,255,.5)';ctx.beginPath();ctx.ellipse(-r*.35,0,r*.65,r*.2,0,0,7);ctx.fill();ctx.stroke();
  ctx.restore();
}

function crosshair(){
  if(state!=='play')return;
  const hot=birds.some(b=>!b.dead&&hit(b,mx,my)),s=1+kick*.45;
  const p=new Path2D();p.arc(0,0,16,0,7);
  [[-26,-9],[9,26]].forEach(([a,b])=>{p.moveTo(a,0);p.lineTo(b,0);p.moveTo(0,a);p.lineTo(0,b)});
  ctx.save();ctx.translate(mx,my);ctx.scale(s,s);ctx.lineCap='round';
  ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=6;ctx.stroke(p);
  ctx.strokeStyle=hot?'#e11d1d':'#111827';ctx.lineWidth=2.5;ctx.stroke(p);
  ctx.fillStyle=hot?'#e11d1d':'#111827';circ(0,0,2.5);
  ctx.restore();
}

function draw(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,C.sky1);g.addColorStop(1,C.sky2);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle=C.sun;circ(W*.82,H*.2,44*K);
  ctx.fillStyle=C.cloud;
  clouds.forEach(c=>{const r=26*c.s*K;circ(c.x,c.y,r);circ(c.x+r,c.y+r*.2,r*1.2);circ(c.x+2*r,c.y,r*.9)});
  birds.forEach(drawBird);
  hills(C.h1,H*.14,H*.05,.006,1);hills(C.h2,H*.05,H*.03,.01,3);
  parts.forEach(p=>{ctx.save();ctx.globalAlpha=Math.min(1,p.life/.5);ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.beginPath();ctx.ellipse(0,0,8*K,3*K,0,0,7);ctx.fill();ctx.restore()});
  ctx.textAlign='center';ctx.font='800 '+Math.round(26*K)+'px "Trebuchet MS","Segoe UI",system-ui,sans-serif';ctx.lineWidth=5;ctx.lineJoin='round';
  pops.forEach(p=>{ctx.globalAlpha=1-p.t/.9;ctx.strokeStyle='rgba(0,0,0,.55)';ctx.strokeText(p.txt,p.x,p.y);ctx.fillStyle='#fff';ctx.fillText(p.txt,p.x,p.y)});
  ctx.globalAlpha=1;
  crosshair();
}

function frame(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;update(dt);draw();requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script>
</body>
</html>
